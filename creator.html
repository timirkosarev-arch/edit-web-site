<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Пантера — Написать создателю</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #080906;
    --panel: #131510;
    --gold: #c9a227;
    --gold-soft: #e3bb34;
    --gold-dim: #8a7128;
    --text: #f1ede0;
    --text-dim: #8f8c7c;
    --line: rgba(241,237,224,0.09);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html{ background: var(--bg); }
  body{
    margin:0;
    min-height: 100svh;
    background:
      radial-gradient(ellipse 100% 40% at 15% 0%, rgba(201,162,39,0.05), transparent 60%),
      radial-gradient(ellipse 120% 60% at 50% 0%, #171911 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .back-link{
    display:flex; align-items:center; gap: 8px;
    text-decoration:none; color: var(--text-dim);
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing:0.08em; text-transform:uppercase;
  }
  .back-link:hover{ color: var(--gold); }
  .mark{ display:flex; align-items:center; gap:10px; }
  .mark svg{ width:20px; height:20px; }
  .mark span{ font-family:'Fraunces', serif; font-size: 15px; letter-spacing:0.12em; text-transform:uppercase; }

  main{ flex: 1; display:flex; flex-direction: column; min-height: 0; }

  /* ---------- Guest / hero state ---------- */
  .contact-hero{
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 20px;
    text-align: center;
  }
  .contact-hero .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing:0.32em;
    text-transform:uppercase; color: var(--gold); margin-bottom: 10px;
  }
  .contact-hero h1{
    font-family:'Fraunces', serif; font-weight: 600; font-size: clamp(30px, 7vw, 44px);
    margin: 0 0 12px; line-height: 1.05;
  }
  .contact-hero h1 em{ font-style: italic; font-weight: 300; color: var(--gold); }
  .contact-hero p{ color: var(--text-dim); font-size: 14px; max-width: 40ch; margin: 0 auto; line-height: 1.5; }

  .google-btn{
    display:flex; align-items:center; gap:10px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 13px 22px;
    border-radius: 100px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin: 26px auto 0;
    transition: border-color .25s ease, transform .25s ease;
  }
  .google-btn:hover{ border-color: rgba(201,162,39,0.4); transform: translateY(-1px); }
  .google-btn svg{ width:18px; height:18px; }

  /* ---------- User chat (full page) ---------- */
  .user-chat{
    flex: 1;
    display: none;
    flex-direction: column;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    min-height: 0;
  }
  .user-chat.active{ display: flex; }
  .user-chat-top{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .user-chip{ display:flex; align-items:center; gap:10px; font-size: 13px; }
  .user-chip img{ width:28px; height:28px; border-radius:50%; }
  .user-chip button{
    background:none; border:none; color: var(--text-dim);
    font-family:'IBM Plex Mono', monospace; font-size: 10px;
    text-decoration: underline; cursor:pointer; padding:0; margin-left: 6px;
  }
  .chat-target{ font-family:'Fraunces', serif; font-size: 16px; }

  .chat-body{
    flex:1;
    overflow-y: auto;
    padding: 18px 20px;
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .chat-empty{ margin:auto; color: var(--text-dim); font-size: 13px; text-align:center; padding: 20px; }

  .bubble{
    max-width: 74%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
  }
  .bubble.me{ align-self: flex-end; background: var(--gold); color: var(--bg); border-bottom-right-radius: 4px; }
  .bubble.them{ align-self: flex-start; background: rgba(241,237,224,0.08); color: var(--text); border-bottom-left-radius: 4px; }
  .bubble .t{ display:block; margin-top: 4px; font-size: 10px; opacity: 0.6; font-family:'IBM Plex Mono', monospace; }

  .chat-input-row{
    display:flex; gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .chat-input-row input{
    flex:1;
    background: rgba(241,237,224,0.06);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 12px 16px;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .chat-input-row input:focus{ border-color: rgba(201,162,39,0.4); }
  .chat-input-row button{
    background: var(--gold);
    border: none;
    color: var(--bg);
    width: 44px; height: 44px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    flex-shrink: 0;
  }

  footer{
    text-align: center;
    padding: 16px 20px 30px;
    flex-shrink: 0;
  }
  .admin-trigger{
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 9px 18px;
    border-radius: 100px;
    cursor: pointer;
    transition: border-color .25s ease, color .25s ease;
  }
  .admin-trigger:hover{ border-color: var(--gold-dim); color: var(--gold); }

  /* ---------- modal (admin login) ---------- */
  .modal-overlay{
    position: fixed; inset: 0; z-index: 80;
    background: rgba(5,5,3,0.75);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px;
  }
  .modal-box h3{ font-family:'Fraunces', serif; font-size: 20px; margin: 0 0 4px; }
  .modal-box .modal-sub{ color: var(--text-dim); font-size: 12px; margin: 0 0 18px; }
  .modal-box input{
    width: 100%;
    background: rgba(241,237,224,0.06);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
  }
  .modal-box input:focus{ border-color: rgba(201,162,39,0.4); }
  .modal-box .modal-actions{ display:flex; gap: 10px; margin-top: 6px; }
  .modal-box button{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 100px;
    padding: 11px 18px;
    border: none;
    cursor: pointer;
    flex: 1;
  }
  .modal-box .btn-primary{ background: var(--gold); color: var(--bg); }
  .modal-box .btn-ghost{ background: none; border: 1px solid var(--line); color: var(--text-dim); }
  .modal-error{ color: #e0665a; font-size: 12px; margin: -4px 0 12px; display:none; }
  .modal-error.show{ display:block; }

  /* ---------- admin dashboard (WhatsApp style) ---------- */
  .admin-dash{
    flex: 1;
    display: none;
    flex-direction: column;
    min-height: 0;
  }
  .admin-dash.active{ display: flex; }
  .admin-top{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(201,162,39,0.06);
    flex-shrink: 0;
  }
  .admin-top .title{ font-family:'Fraunces', serif; font-size: 17px; }
  .admin-top .title em{ color: var(--gold); font-style: italic; }
  .admin-top button{
    background:none; border: 1px solid var(--line); color: var(--text-dim);
    font-family:'IBM Plex Mono', monospace; font-size: 10px; letter-spacing:0.08em;
    text-transform: uppercase; border-radius: 100px; padding: 8px 14px; cursor:pointer;
  }
  .admin-body{ flex: 1; display: flex; min-height: 0; }
  .admin-sidebar{
    width: 100%;
    max-width: 320px;
    border-right: 1px solid var(--line);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .conv-item{
    display:flex; align-items:center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .2s ease;
  }
  .conv-item:hover, .conv-item.active{ background: rgba(201,162,39,0.08); }
  .conv-item img{ width: 40px; height: 40px; border-radius: 50%; flex-shrink:0; background: var(--panel); }
  .conv-item .ci-info{ min-width:0; flex: 1; }
  .conv-item .ci-name{ font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .conv-item .ci-last{ font-size: 12px; color: var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .admin-empty-list{ padding: 30px 16px; color: var(--text-dim); font-size: 13px; text-align:center; }

  .admin-chat{ flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .admin-chat-head{
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display:flex; align-items:center; gap: 10px;
    flex-shrink: 0;
  }
  .admin-chat-head .back-btn{ display:none; background:none; border:none; color: var(--gold); font-size: 18px; cursor:pointer; }
  .admin-chat-body{ flex:1; overflow-y:auto; padding: 18px; display:flex; flex-direction:column; gap: 8px; }
  .admin-chat-input{ display:flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); flex-shrink: 0; }
  .admin-chat-input input{
    flex:1; background: rgba(241,237,224,0.06); border: 1px solid var(--line);
    border-radius: 100px; padding: 11px 16px; color: var(--text);
    font-family:'Inter', sans-serif; font-size: 14px; outline: none;
  }
  .admin-chat-input button{
    background: var(--gold); border:none; color: var(--bg);
    width: 42px; height: 42px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .admin-chat-placeholder{ margin:auto; color: var(--text-dim); font-size: 14px; }

  @media (max-width: 720px){
    .admin-sidebar{ max-width: none; display: flex; flex-direction: column; }
    .admin-body.chat-open .admin-sidebar{ display: none; }
    .admin-body:not(.chat-open) .admin-chat{ display: none; }
    .admin-chat-head .back-btn{ display: inline-block; }
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html">← Пантера</a>
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="11" stroke="#c9a227" stroke-width="1"/>
      <circle cx="9" cy="10.5" r="1.2" fill="#c9a227"/>
      <circle cx="15" cy="10.5" r="1.2" fill="#c9a227"/>
      <path d="M8 15c1.2 1 2.6 1.5 4 1.5s2.8-.5 4-1.5" stroke="#c9a227" stroke-width="1" stroke-linecap="round"/>
    </svg>
    <span>Creator</span>
  </div>
</header>

<main>
  <!-- Guest state -->
  <div class="contact-hero" id="guestState">
    <div class="eyebrow">Написать создателю</div>
    <h1>Есть вопрос<br><em>или идея?</em></h1>
    <p>Войди через Google — и напиши напрямую создателю сайта «Пантера». Он отвечает лично.</p>
    <button class="google-btn" id="googleSignInBtn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.4 0-13.8 4.1-17.1 10.1z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.5C29.6 34.8 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.6 5.1C9.2 39.8 16 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.5l6.5 5.5C41.6 35.9 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Войти через Google
    </button>
  </div>

  <!-- Signed-in user: chat with Creator -->
  <div class="user-chat" id="userChat">
    <div class="user-chat-top">
      <div class="chat-target">Creator</div>
      <div class="user-chip" id="userChip"></div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Написать сообщение..." maxlength="500">
      <button id="chatSendBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>

  <!-- Admin dashboard -->
  <div class="admin-dash" id="adminDash">
    <div class="admin-top">
      <div class="title">Панель <em>Creator</em></div>
      <button id="adminLogoutBtn">Выйти из панели</button>
    </div>
    <div class="admin-body" id="adminBody">
      <div class="admin-sidebar" id="adminSidebar">
        <div class="admin-empty-list" id="adminEmptyList">Пока нет сообщений</div>
      </div>
      <div class="admin-chat">
        <div class="admin-chat-head" id="adminChatHead" style="display:none;">
          <button class="back-btn" id="adminBackBtn">←</button>
          <div class="ci-name" id="adminChatTitle"></div>
        </div>
        <div class="admin-chat-body" id="adminChatBody">
          <div class="admin-chat-placeholder">Выбери диалог слева</div>
        </div>
        <div class="admin-chat-input" id="adminChatInput" style="display:none;">
          <input type="text" id="adminMsgInput" placeholder="Ответить..." maxlength="500">
          <button id="adminMsgSendBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer id="footerArea">
  <button class="admin-trigger" id="adminTriggerBtn">Я администратор → нажми сюда</button>
</footer>

<!-- Admin login modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-box">
    <h3>Вход администратора</h3>
    <p class="modal-sub">Только для создателя сайта</p>
    <input type="text" id="adminName" placeholder="Имя">
    <input type="password" id="adminPass" placeholder="Пароль">
    <p class="modal-error" id="adminError">Неверное имя или пароль</p>
    <div class="modal-actions">
      <button class="btn-ghost" id="adminCancelBtn">Отмена</button>
      <button class="btn-primary" id="adminLoginBtn">Войти</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, push, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyApnoSkcthpVPcMSAJXL-PFT-UpEi9ZdoI",
    authDomain: "exaroton-65e4e.firebaseapp.com",
    databaseURL: "https://exaroton-65e4e-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "exaroton-65e4e",
    storageBucket: "exaroton-65e4e.firebasestorage.app",
    messagingSenderId: "175992933890",
    appId: "1:175992933890:web:5196918da3f79520e5211b",
    measurementId: "G-V8RF5D60MH"
  };

  function escapeHTML(str){
    return str.replace(/[&<>'"]/g, t => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[t]));
  }
  function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' }) + ' ' +
           d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
  }

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const guestState = document.getElementById('guestState');
  const userChat = document.getElementById('userChat');
  const chatBody = document.getElementById('chatBody');
  const userChip = document.getElementById('userChip');

  let currentUser = null;
  let userMsgsUnsub = null;

  function doSignIn(){ signInWithPopup(auth, provider).catch(err => console.error(err)); }
  document.getElementById('googleSignInBtn').addEventListener('click', doSignIn);

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      guestState.style.display = 'none';
      userChat.classList.add('active');
      userChip.innerHTML = `
        <img src="${user.photoURL || ''}" alt="">
        <span>${escapeHTML(user.displayName || 'Пользователь')}</span>
        <button id="signOutBtn">выйти</button>`;
      document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));

      update(ref(db, 'chats/' + user.uid + '/profile'), {
        name: user.displayName || 'Пользователь',
        photo: user.photoURL || '',
        uid: user.uid
      });

      if (userMsgsUnsub) userMsgsUnsub();
      userMsgsUnsub = onValue(ref(db, 'chats/' + user.uid + '/messages'), (snap) => {
        const data = snap.val();
        chatBody.innerHTML = '';
        if (!data) {
          chatBody.innerHTML = '<div class="chat-empty">Напиши первое сообщение создателю сайта 👋</div>';
        } else {
          Object.values(data).sort((a,b) => a.ts - b.ts).forEach(m => {
            const b = document.createElement('div');
            b.className = 'bubble ' + (m.from === 'creator' ? 'them' : 'me');
            b.innerHTML = escapeHTML(m.text) + '<span class="t">' + fmtTime(m.ts) + '</span>';
            chatBody.appendChild(b);
          });
        }
        chatBody.scrollTop = chatBody.scrollHeight;
      });
    } else {
      guestState.style.display = 'block';
      userChat.classList.remove('active');
      if (userMsgsUnsub) { userMsgsUnsub(); userMsgsUnsub = null; }
    }
  });

  document.getElementById('chatSendBtn').addEventListener('click', sendUserMessage);
  document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendUserMessage(); });
  function sendUserMessage(){
    if (!currentUser) return;
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    set(push(ref(db, 'chats/' + currentUser.uid + '/messages')), { from: 'user', text, ts: Date.now() });
  }

  /* ---------------- Admin ---------------- */
  const adminModal = document.getElementById('adminModal');
  const adminDash = document.getElementById('adminDash');
  const footerArea = document.getElementById('footerArea');
  const ADMIN_NAME = 'Creator';
  const ADMIN_PASS = '12345';

  document.getElementById('adminTriggerBtn').addEventListener('click', () => {
    document.getElementById('adminError').classList.remove('show');
    document.getElementById('adminName').value = '';
    document.getElementById('adminPass').value = '';
    adminModal.classList.add('open');
  });
  document.getElementById('adminCancelBtn').addEventListener('click', () => adminModal.classList.remove('open'));

  document.getElementById('adminLoginBtn').addEventListener('click', () => {
    const name = document.getElementById('adminName').value.trim();
    const pass = document.getElementById('adminPass').value;
    if (name === ADMIN_NAME && pass === ADMIN_PASS) {
      adminModal.classList.remove('open');
      guestState.style.display = 'none';
      userChat.classList.remove('active');
      footerArea.style.display = 'none';
      adminDash.classList.add('active');
      loadConversations();
    } else {
      document.getElementById('adminError').classList.add('show');
    }
  });

  document.getElementById('adminLogoutBtn').addEventListener('click', () => {
    adminDash.classList.remove('active');
    footerArea.style.display = 'block';
    if (currentUser) { userChat.classList.add('active'); } else { guestState.style.display = 'block'; }
  });

  const adminSidebar = document.getElementById('adminSidebar');
  const adminEmptyList = document.getElementById('adminEmptyList');
  const adminChatBody = document.getElementById('adminChatBody');
  const adminChatHead = document.getElementById('adminChatHead');
  const adminChatTitle = document.getElementById('adminChatTitle');
  const adminChatInput = document.getElementById('adminChatInput');
  const adminBody = document.getElementById('adminBody');

  let selectedUid = null;
  let adminMsgsUnsub = null;

  function loadConversations(){
    onValue(ref(db, 'chats'), (snap) => {
      const data = snap.val();
      adminSidebar.querySelectorAll('.conv-item').forEach(el => el.remove());
      if (!data) { adminEmptyList.style.display = 'block'; return; }
      const entries = Object.entries(data).filter(([uid, v]) => v.messages);
      if (entries.length === 0) { adminEmptyList.style.display = 'block'; return; }
      adminEmptyList.style.display = 'none';

      entries
        .map(([uid, v]) => {
          const msgs = v.messages ? Object.values(v.messages) : [];
          const last = msgs.sort((a,b) => b.ts - a.ts)[0];
          return { uid, profile: v.profile || {}, last };
        })
        .sort((a,b) => (b.last ? b.last.ts : 0) - (a.last ? a.last.ts : 0))
        .forEach(({ uid, profile, last }) => {
          const item = document.createElement('div');
          item.className = 'conv-item' + (uid === selectedUid ? ' active' : '');
          item.innerHTML = `
            <img src="${profile.photo || ''}" alt="">
            <div class="ci-info">
              <div class="ci-name">${escapeHTML(profile.name || 'Пользователь')}</div>
              <div class="ci-last">${last ? escapeHTML(last.text) : ''}</div>
            </div>`;
          item.addEventListener('click', () => openConversation(uid, profile.name || 'Пользователь'));
          adminSidebar.appendChild(item);
        });
    });
  }

  function openConversation(uid, name){
    selectedUid = uid;
    adminChatHead.style.display = 'flex';
    adminChatTitle.textContent = name;
    adminChatInput.style.display = 'flex';
    adminBody.classList.add('chat-open');
    adminSidebar.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));

    if (adminMsgsUnsub) adminMsgsUnsub();
    adminMsgsUnsub = onValue(ref(db, 'chats/' + uid + '/messages'), (snap) => {
      const data = snap.val();
      adminChatBody.innerHTML = '';
      if (!data) { adminChatBody.innerHTML = '<div class="admin-chat-placeholder">Нет сообщений</div>'; return; }
      Object.values(data).sort((a,b) => a.ts - b.ts).forEach(m => {
        const b = document.createElement('div');
        b.className = 'bubble ' + (m.from === 'creator' ? 'me' : 'them');
        b.innerHTML = escapeHTML(m.text) + '<span class="t">' + fmtTime(m.ts) + '</span>';
        adminChatBody.appendChild(b);
      });
      adminChatBody.scrollTop = adminChatBody.scrollHeight;
    });
  }

  document.getElementById('adminBackBtn').addEventListener('click', () => adminBody.classList.remove('chat-open'));

  document.getElementById('adminMsgSendBtn').addEventListener('click', sendAdminMessage);
  document.getElementById('adminMsgInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendAdminMessage(); });
  function sendAdminMessage(){
    if (!selectedUid) return;
    const input = document.getElementById('adminMsgInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    set(push(ref(db, 'chats/' + selectedUid + '/messages')), { from: 'creator', text, ts: Date.now() });
  }
</script>
</body>
</html>
