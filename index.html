<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пантера Уфф — видео</title>
<style>
  :root{
    --bg: #0e0f0c;
    --bg-panel: #161810;
    --accent: #9fd13c;
    --text: #eef0e6;
    --text-dim: #9a9d8f;
    --line: #2a2d22;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    padding: 0 0 80px;
  }
  header{
    padding: 64px 24px 32px;
    text-align:center;
    border-bottom: 1px solid var(--line);
  }
  header .eyebrow{
    font-family: 'Courier New', monospace;
    letter-spacing: .3em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 12px;
  }
  header h1{
    font-size: clamp(36px, 7vw, 64px);
    margin: 0;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  header p{
    color: var(--text-dim);
    font-family: Arial, sans-serif;
    font-size: 14px;
    margin-top: 12px;
  }
  main{
    max-width: 1000px;
    margin: 0 auto;
    padding: 48px 24px 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
  }
  @media (min-width: 760px){
    main{ grid-template-columns: 1fr 1fr; }
  }
  .card{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .card .label{
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 14px 16px 0;
  }
  .card .name{
    font-family: Arial, sans-serif;
    font-size: 15px;
    color: var(--text-dim);
    padding: 4px 16px 14px;
  }
  video{
    width: 100%;
    display: block;
    background: #000;
    aspect-ratio: 9/16;
    object-fit: cover;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Видеотека</div>
  <h1>Пантера Уфф</h1>
  <p>Полная подборка — 4 видео</p>
</header>

<main>
  <div class="card">
    <div class="label">01</div>
    <div class="name">Пантера Уфф</div>
    <video controls preload="metadata">
      <source src="https://ddjauef2hwzqfvdm.public.blob.vercel-storage.com/WhatsApp%20Video%202026-08-28%20at%2023.05.40%20%281%29.mp4" type="video/mp4">
    </video>
  </div>

  <div class="card">
    <div class="label">02</div>
    <div class="name">Пантера Уфф</div>
    <video controls preload="metadata">
      <source src="https://ddjauef2hwzqfvdm.public.blob.vercel-storage.com/WhatsApp%20Video%202026-08-28%20at%2023.05.40.mp4" type="video/mp4">
    </video>
  </div>

  <div class="card">
    <div class="label">03</div>
    <div class="name">Пантера Уфф</div>
    <video controls preload="metadata">
      <source src="https://ddjauef2hwzqfvdm.public.blob.vercel-storage.com/WhatsApp%20Video%202026-08-28%20at%2023.05.50.mp4" type="video/mp4">
    </video>
  </div>

  <div class="card">
    <div class="label">04</div>
    <div class="name">Пантера Уфф</div>
    <video controls preload="metadata">
      <source src="https://ddjauef2hwzqfvdm.public.blob.vercel-storage.com/WhatsApp%20Video%202026-08-28%20at%2023.06.08.mp4" type="video/mp4">
    </video>
  </div>
</main>

</body>
</html>
