<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Пантера — Каталог</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b08;
    --panel: #131510;
    --gold: #c9a227;
    --gold-dim: #8a7128;
    --text: #f1ede0;
    --text-dim: #8f8c7c;
    --line: rgba(241,237,224,0.09);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html{ background: var(--bg); scroll-behavior: smooth; }

  body{
    margin:0;
    background: radial-gradient(ellipse 120% 60% at 50% 0%, #171911 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100svh;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  body::before{
    content:"";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.035;
    background-image: repeating-linear-gradient(115deg, #fff 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }

  header{
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    background: linear-gradient(to bottom, rgba(10,11,8,0.92), rgba(10,11,8,0.7) 70%, transparent);
    backdrop-filter: blur(6px);
  }
  .mark{ display:flex; align-items:center; gap:10px; }
  .mark svg{ width:22px; height:22px; flex-shrink:0; }
  .mark span{
    font-family: 'Fraunces', serif;
    font-size: 17px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .count-pill{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: 100px;
    padding: 5px 11px;
  }
  .header-info{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .view-pill{
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    border-color: rgba(241,237,224,0.15);
  }
  .view-pill svg{ opacity: 0.7; flex-shrink: 0; }
  .view-pill span{ color: var(--text); font-weight: 500; }

  .hero{ position: relative; padding: 8px 20px 24px; z-index: 2; }
  .hero .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 18px 0 6px;
  }
  .hero h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(38px, 12vw, 54px);
    line-height: 0.94;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .hero h1 em{ font-style: italic; font-weight: 300; color: var(--gold); }
  .hero p{
    color: var(--text-dim);
    font-size: 14px;
    max-width: 34ch;
    margin: 0;
    line-height: 1.5;
  }

  /* --- search --- */
  .search-wrap{
    position: relative;
    z-index: 2;
    padding: 0 20px 8px;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap: 12px;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 14px 20px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .search-box:focus-within{
    border-color: rgba(201,162,39,0.45);
    box-shadow: 0 0 0 3px rgba(201,162,39,0.08);
  }
  .search-box svg{ flex-shrink:0; color: var(--gold-dim); }
  .search-box input{
    flex:1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
  }
  .search-box input::placeholder{ color: var(--text-dim); }
  .search-hint{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
    white-space: nowrap;
  }

  main{
    position: relative;
    z-index: 2;
    padding: 20px 20px 60px;
    max-width: 900px;
    margin: 0 auto;
  }

  .list{
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .site-card{
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 20px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .site-card::before{
    content:"";
    position:absolute;
    inset: -60%;
    background: radial-gradient(circle at 0% 50%, rgba(201,162,39,0.14), transparent 60%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .site-card:hover, .site-card:focus-visible{
    transform: translateY(-2px);
    border-color: rgba(201,162,39,0.35);
    box-shadow: 0 20px 45px -25px rgba(0,0,0,0.7);
  }
  .site-card:hover::before, .site-card:focus-visible::before{ opacity: 1; }

  .site-num{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 28px;
    color: var(--gold-dim);
    width: 40px;
    flex-shrink: 0;
    line-height: 1;
  }
  .site-info{ flex: 1; min-width: 0; }
  .site-name{
    font-family: 'Fraunces', serif;
    font-size: 19px;
    letter-spacing: 0.01em;
    margin-bottom: 4px;
  }
  .site-desc{
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.4;
  }
  .site-url{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--gold-dim);
    margin-top: 6px;
    word-break: break-all;
  }
  .site-arrow{
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .site-card:hover .site-arrow{
    background: var(--gold);
    color: var(--bg);
    transform: translateX(3px);
  }

  .empty-state{
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .empty-state.show{ display: block; }

  footer{
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 30px 20px 50px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .08em;
    border-top: 1px solid var(--line);
  }
  footer .gold{ color: var(--gold-dim); }

  @media (min-width: 900px){
    header{ padding: 26px 56px; }
    .mark svg{ width:26px; height:26px; }
    .mark span{ font-size: 19px; }

    .hero, .search-wrap, main{
      max-width: 900px;
      margin: 0 auto;
      padding-left: 56px;
      padding-right: 56px;
    }
    .hero{ padding-top: 40px; padding-bottom: 30px; }
    .hero h1{ font-size: clamp(56px, 5vw, 72px); }
    footer{ padding: 44px 56px 64px; }
  }
</style>
</head>
<body>

<header>
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="11" stroke="#c9a227" stroke-width="1"/>
      <circle cx="9" cy="10.5" r="1.2" fill="#c9a227"/>
      <circle cx="15" cy="10.5" r="1.2" fill="#c9a227"/>
      <path d="M8 15c1.2 1 2.6 1.5 4 1.5s2.8-.5 4-1.5" stroke="#c9a227" stroke-width="1" stroke-linecap="round"/>
    </svg>
    <span>Пантера</span>
  </div>
  <div class="header-info">
    <div class="count-pill view-pill" title="Реальные просмотры">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <span id="viewCounter">...</span>
    </div>
    <div class="count-pill" id="countPill">01 / сайт</div>
  </div>
</header>

<section class="hero">
  <div class="eyebrow">Каталог</div>
  <h1>Пантера<br><em>Каталог</em></h1>
  <p>Подборка сайтов из мира Пантеры. Ищи и переходи.</p>
</section>

<div class="search-wrap">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" id="searchInput" placeholder="Поиск по сайтам..." autocomplete="off">
    <span class="search-hint" id="searchHint"></span>
  </div>
</div>

<main>
  <div class="list" id="siteList">
    <a class="site-card" data-name="Пантера Уфф" data-desc="Ночная видео-коллекция и живые комментарии" href="https://panterha.wededit.xyz/" target="_blank" rel="noopener">
      <span class="site-num">01</span>
      <div class="site-info">
        <div class="site-name">Пантера Уфф</div>
        <div class="site-desc">Ночная видео-коллекция и живые комментарии</div>
        <div class="site-url">panterha.wededit.xyz</div>
      </div>
      <span class="site-arrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </span>
    </a>
  </div>

  <div class="empty-state" id="emptyState">Ничего не найдено. Попробуй другой запрос.</div>
</main>

<footer>
  <span class="gold">Пантера</span> · каталог · 2026
</footer>

<script>
  const input = document.getElementById('searchInput');
  const cards = Array.from(document.querySelectorAll('.site-card'));
  const empty = document.getElementById('emptyState');
  const hint = document.getElementById('searchHint');
  const countPill = document.getElementById('countPill');
  const total = cards.length;

  function updateCount(n){
    countPill.textContent = String(n).padStart(2, '0') + ' / ' + (n === 1 ? 'сайт' : 'сайтов');
  }
  updateCount(total);

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    let visible = 0;
    cards.forEach(card => {
      const name = (card.dataset.name || '').toLowerCase();
      const desc = (card.dataset.desc || '').toLowerCase();
      const match = !q || name.includes(q) || desc.includes(q);
      card.style.display = match ? '' : 'none';
      if (match) visible++;
    });
    empty.classList.toggle('show', visible === 0);
    updateCount(visible);
    hint.textContent = q ? visible + ' из ' + total : '';
  });
</script>

<!-- Подключаем Firebase для счётчика реальных просмотров -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyApnoSkcthpVPcMSAJXL-PFT-UpEi9ZdoI",
    authDomain: "exaroton-65e4e.firebaseapp.com",
    databaseURL: "https://exaroton-65e4e-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "exaroton-65e4e",
    storageBucket: "exaroton-65e4e.firebasestorage.app",
    messagingSenderId: "175992933890",
    appId: "1:175992933890:web:5196918da3f79520e5211b",
    measurementId: "G-V8RF5D60MH"
  };

  const counterEl = document.getElementById('viewCounter');

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Отдельный узел для счётчика каталога, чтобы не мешать счётчику видео-страницы
    const counterRef = ref(db, 'catalogViews');

    runTransaction(counterRef, (currentData) => {
      return (currentData || 0) + 1;
    }).then((result) => {
      if (result.committed) {
        counterEl.textContent = result.snapshot.val().toLocaleString('ru-RU');
      } else {
        counterEl.textContent = '-';
      }
    }).catch((error) => {
      console.error("Ошибка Firebase:", error);
      counterEl.textContent = '-';
    });
  } catch (error) {
    console.error("Ошибка инициализации Firebase:", error);
    counterEl.textContent = '-';
  }
</script>
</body>
</html>
